# CodeQL over the three languages this repository is written in.
#
# This began as the unedited web-UI template. What changed here, and what was
# deliberately left alone:
#
#  - Actions are pinned to full commit SHAs with the version in a comment, so a
#    tag repointed upstream cannot change what this workflow executes.
#    Dependabot's `github-actions` ecosystem keeps the pins current.
#  - `timeout-minutes` was missing; a hung Gradle trace would otherwise sit on a
#    runner until the platform killed it.
#  - The runner expression selected `macos-latest` for Swift, a language not in
#    the matrix, and the manual-build placeholder could never fire for the same
#    reason. Both are removed; `packages: read` covered private CodeQL packs this
#    repository does not use. To build explicitly instead of letting CodeQL
#    infer the command, set `build-mode: manual` for that language and add a
#    build step here in its place.
#  - `build-mode: autobuild` is KEPT. It works: run 40104034335 on `main` built
#    the app in 6m21s and CodeQL reported a live alert in `CrashReporter.kt`. It
#    runs on the runner's own Temurin 17 rather than the JDK 21 that ci.yml
#    installs — a difference worth knowing about, not a failure.
#
# What this scan cannot see, and should not be assumed to cover: the browser
# client is JavaScript written inside a Kotlin string literal
# (`app/src/main/java/com/pulsedrop/app/server/WebClientHtml.kt`). CodeQL picks
# extractors by file extension, so the most exposed input-handling code in the
# app is analysed only as Kotlin, never as JavaScript. The
# `javascript-typescript` entry below sees `site/` and `dev/` and nothing else.

name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '15 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      # Publishes SARIF results to the security tab.
      security-events: write
      # CodeQL reads the workflow run when analysing the `actions` language.
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: java-kotlin
          build-mode: autobuild
        # Only `site/` and `dev/`; not the browser client. See the header note.
        - language: javascript-typescript
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      with:
        category: "/language:${{ matrix.language }}"
