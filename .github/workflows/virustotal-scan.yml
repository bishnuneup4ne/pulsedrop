name: VirusTotal scan

on:
  release:
    types: [published]

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Download release APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$TAG" -p app-release.apk -D "$RUNNER_TEMP"

      - name: Submit to VirusTotal
        id: vt
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VT_API_KEY:-}" ]; then
            echo "::notice::VT_API_KEY secret not set - skipping scan."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          APK="$RUNNER_TEMP/app-release.apk"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          api() { curl -s -H "x-apikey: $VT_API_KEY" "$@"; }
          CODE=$(api -o /dev/null -w "%{http_code}" "https://www.virustotal.com/api/v3/files/$SHA")
          if [ "$CODE" != "200" ]; then
            JOB=$(api -F "file=@$APK" "https://www.virustotal.com/api/v3/files" | jq -r '.data.id // empty')
            if [ -z "$JOB" ]; then
              echo "::error::VirusTotal upload failed (check key/rate limits)"; exit 1
            fi
            for _ in $(seq 1 40); do
              ST=$(api "https://www.virustotal.com/api/v3/analyses/$JOB" | jq -r '.data.attributes.status // "unknown"')
              [ "$ST" = "completed" ] && break
              sleep 15
            done
            [ "$ST" = "completed" ] || echo "::warning::analysis still $ST after 10 min"
          fi
          STATS=$(api "https://www.virustotal.com/api/v3/files/$SHA" | jq -r '.data.attributes.last_analysis_stats | "malicious=\(.malicious) suspicious=\(.suspicious) clean=\(.clean) undetected=\(.undetected)"')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "stats=$STATS" >> "$GITHUB_OUTPUT"
          echo "permalink=https://www.virustotal.com/gui/file/$SHA" >> "$GITHUB_OUTPUT"

      - name: Publish scan link as an issue
        if: steps.vt.outputs.skipped != 'true' && steps.vt.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          LINK: ${{ steps.vt.outputs.permalink }}
          STATS: ${{ steps.vt.outputs.stats }}
          SHA: ${{ steps.vt.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues" \
            -f title="VirusTotal scan: $TAG" \
            -f body="APK for **$TAG** scanned automatically on publish.

- SHA-256: \`$SHA\`
- Permanent report: $LINK
- Engine summary: $STATS

The permalink always points at this exact file, so it can be linked from the release notes or README."
