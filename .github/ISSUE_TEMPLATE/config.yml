# NOTE FOR MAINTAINERS: replace `pulsedrop/pulsedrop` below with this repository's real
# <owner>/<repo> path before you rely on these links.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/pulsedrop/pulsedrop/security/advisories/new
    about: >-
      Do not open a public issue. Use a private security advisory so we can fix it before
      publishing an exploit against running installs.
  - name: Security policy
    url: https://github.com/pulsedrop/pulsedrop/blob/main/SECURITY.md
    about: What counts as a vulnerability here, and what documented behaviour does not.
